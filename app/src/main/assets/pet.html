<![CDATA[<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #pet {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

  #bubble {
    position: absolute;
    top: -36px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.92);
    color: #333;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 10px;
    white-space: nowrap;
    max-width: 140px;
    text-overflow: ellipsis;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    font-family: sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  #bubble.show { opacity: 1; }
  #bubble.angry { background: #ff5252; color: #fff; }
  #bubble.shy { background: #e0e0e0; color: #666; }
  #bubble.love { background: #ff80ab; color: #fff; }

  #heat {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, rgba(255,0,0,0.2) 0%, transparent 70%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s;
  }
</style>
</head>
<body>
<div id="heat"></div>
<div id="bubble"></div>
<div id="pet"></div>

<script>
// ===== SUPABASE CONFIG =====
const SUPABASE_URL = 'https://gvzhoxepylrhseuumgls.supabase.co';
const SUPABASE_KEY = 'sb_publishable_shYLYrERVyrXtjiDbG62Ng_9TUH3pg8';

// ===== 48×48 PIXEL CAT — 照抄参考图结构 + 蓝身绿眼 =====
const COLORS = {
  body:    '#8BB8EA',
  stripe:  '#5A8EC0',
  belly:   '#C5E0F5',
  eye:     '#4ADE80',
  outline: '#333333',
  earIn:   '#f8b8b8',
  blush:   '#FFB3B3',
  nose:    '#f8b8b8',
};

// 表情：每个眼睛2×2像素 [左上,右上,左下,右下]，用COLORS的键
const EYE_DEFS = {
  idle:    { L: ['eye','eye','eye','eye'], R: ['eye','eye','eye','eye'] },
  happy:   { L: ['body','eye','eye','body'], R: ['eye','body','body','eye'] },
  angry:   { L: ['eye','body','body','eye'], R: ['body','eye','eye','body'] },
  love:    { L: ['blush','blush','blush','blush'], R: ['blush','blush','blush','blush'] },
  shy:     { L: ['eye','body','eye','body'], R: ['body','eye','body','eye'] },
  sleepy:  { L: ['body','body','eye','eye'], R: ['eye','eye','body','body'] },
  surprise: { L: ['body','eye','eye','body'], R: ['body','eye','eye','body'] },
};

function ec(key) { return COLORS[key] || COLORS.body; }

function buildPixelSVG(exp) {
  const ed = EYE_DEFS[exp] || EYE_DEFS.idle;
  const c = COLORS;
  const LE = ed.L, RE = ed.R;

  return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<rect x="14" y="11" width="4" height="1" fill="${c.outline}"/>
<rect x="13" y="12" width="1" height="4" fill="${c.outline}"/>
<rect x="18" y="12" width="1" height="3" fill="${c.outline}"/>
<rect x="30" y="11" width="4" height="1" fill="${c.outline}"/>
<rect x="34" y="12" width="1" height="4" fill="${c.outline}"/>
<rect x="29" y="12" width="1" height="3" fill="${c.outline}"/>
<rect x="14" y="12" width="4" height="3" fill="${c.body}"/>
<rect x="15" y="13" width="2" height="2" fill="${c.earIn}"/>
<rect x="30" y="12" width="4" height="3" fill="${c.body}"/>
<rect x="31" y="13" width="2" height="2" fill="${c.earIn}"/>
<rect x="18" y="15" width="12" height="1" fill="${c.outline}"/>
<rect x="12" y="16" width="1" height="11" fill="${c.outline}"/>
<rect x="35" y="16" width="1" height="11" fill="${c.outline}"/>
<rect x="13" y="27" width="22" height="1" fill="${c.outline}"/>
<rect x="14" y="28" width="1" height="9" fill="${c.outline}"/>
<rect x="33" y="28" width="1" height="9" fill="${c.outline}"/>
<rect x="15" y="37" width="18" height="1" fill="${c.outline}"/>
<rect x="35" y="30" width="4" height="1" fill="${c.outline}"/>
<rect x="39" y="31" width="1" height="5" fill="${c.outline}"/>
<rect x="34" y="36" width="5" height="1" fill="${c.outline}"/>
<rect x="13" y="16" width="22" height="11" fill="${c.body}"/>
<rect x="15" y="28" width="18" height="9" fill="${c.body}"/>
<rect x="35" y="31" width="4" height="5" fill="${c.body}"/>
<rect x="21" y="16" width="6" height="1" fill="${c.stripe}"/>
<rect x="23" y="17" width="2" height="2" fill="${c.stripe}"/>
<rect x="13" y="21" width="3" height="1" fill="${c.stripe}"/>
<rect x="32" y="21" width="3" height="1" fill="${c.stripe}"/>
<rect x="36" y="31" width="1" height="5" fill="${c.stripe}"/>
<rect x="38" y="31" width="1" height="5" fill="${c.stripe}"/>
<rect x="19" y="22" width="1" height="1" fill="${ec(LE[0])}"/>
<rect x="20" y="22" width="1" height="1" fill="${ec(LE[1])}"/>
<rect x="19" y="23" width="1" height="1" fill="${ec(LE[2])}"/>
<rect x="20" y="23" width="1" height="1" fill="${ec(LE[3])}"/>
<rect x="27" y="22" width="1" height="1" fill="${ec(RE[0])}"/>
<rect x="28" y="22" width="1" height="1" fill="${ec(RE[1])}"/>
<rect x="27" y="23" width="1" height="1" fill="${ec(RE[2])}"/>
<rect x="28" y="23" width="1" height="1" fill="${ec(RE[3])}"/>
<rect x="24" y="25" width="1" height="1" fill="${c.nose}"/>
<rect x="17" y="24" width="2" height="2" fill="${c.blush}"/>
<rect x="29" y="24" width="2" height="2" fill="${c.blush}"/>
<rect x="20" y="28" width="8" height="9" fill="${c.belly}"/>
<rect x="21" y="35" width="1" height="2" fill="${c.outline}"/>
<rect x="26" y="35" width="1" height="2" fill="${c.outline}"/>
</svg>`;
}

// ===== GLOBAL ENGINE =====
window.petEngine = {
  mood: 'idle',
  heat: 0,
  lastGestureTime: Date.now(),
  gestureCount: 0,

  onTap() {
    this.gestureCount++;
    this.lastGestureTime = Date.now();
    this.heat = Math.min(100, this.heat + 5);
    this.logGesture('tap');
    showRandomReaction('tap');
  },

  onDoubleTap() {
    this.gestureCount += 2;
    this.lastGestureTime = Date.now();
    this.heat = Math.min(100, this.heat + 12);
    this.logGesture('double_tap');
    showReaction('love');
    say('呀！别戳了', 'love');
  },

  onLongPress() {
    this.gestureCount += 3;
    this.lastGestureTime = Date.now();
    this.heat = Math.min(100, this.heat + 20);
    this.logGesture('long_press');
    showReaction('angry');
    say('……干嘛', 'shy');
  },

  onAICommand(cmd) {
    if (!cmd) return;
    switch (cmd.message_type) {
      case 'bubble':
        say(cmd.content, cmd.style || 'normal', (cmd.duration_seconds || 5) * 1000);
        break;
      case 'expression':
        showReaction(cmd.content);
        break;
      case 'action':
        playAnimation(cmd.content);
        break;
      case 'notification':
        say(cmd.content, 'angry', 8000);
        break;
    }
  },

  logGesture(type) {
    if (!SUPABASE_URL || SUPABASE_URL.indexOf('%%') === 0) return;
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/rest/v1/gesture_log', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
    xhr.setRequestHeader('Prefer', 'return=minimal');
    xhr.send(JSON.stringify({ gesture_type: type }));
  }
};

let currentExp = 'idle';
let animTimer = null;

function renderPet(exp) {
  currentExp = exp || currentExp;
  document.getElementById('pet').innerHTML = buildPixelSVG(currentExp);
}

function showReaction(exp) {
  renderPet(exp);
  clearTimeout(animTimer);
  animTimer = setTimeout(() => renderPet('idle'), 2500);
}

function showRandomReaction(gesture) {
  const pool = gesture === 'tap' ? ['happy', 'surprise'] : ['angry', 'shy'];
  const r = pool[Math.floor(Math.random() * pool.length)];
  showReaction(r);
}

function playAnimation(name) {
  const el = document.getElementById('pet');
  switch (name) {
    case 'bounce':
      el.style.transition = 'transform 0.1s';
      el.style.transform = 'translateY(-6px)';
      setTimeout(() => { el.style.transform = 'translateY(0)'; }, 120);
      setTimeout(() => { el.style.transition = ''; }, 250);
      break;
    case 'shake':
      el.style.transition = 'transform 0.08s';
      el.style.transform = 'rotate(-4deg)';
      setTimeout(() => { el.style.transform = 'rotate(4deg)'; }, 80);
      setTimeout(() => { el.style.transform = 'rotate(0)'; el.style.transition = ''; }, 160);
      break;
    case 'nod':
      el.style.transition = 'transform 0.12s';
      el.style.transform = 'translateY(3px)';
      setTimeout(() => { el.style.transform = 'translateY(0)'; el.style.transition = ''; }, 130);
      break;
  }
}

// ===== 气泡 =====
let bubbleTimer = null;
function say(text, style, duration) {
  const b = document.getElementById('bubble');
  b.textContent = text;
  b.className = style || '';
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove('show'), duration || 4000);
}

// ===== Heat 衰减 =====
setInterval(() => {
  window.petEngine.heat = Math.max(0, window.petEngine.heat - 1);
  document.getElementById('heat').style.opacity = window.petEngine.heat / 100;
}, 30000);

// ===== Supabase 轮询 =====
function pollAICommands() {
  if (!SUPABASE_URL || SUPABASE_URL.indexOf('%%') === 0) return;
  const xhr = new XMLHttpRequest();
  xhr.open('GET', SUPABASE_URL + '/rest/v1/ai_messages?delivered=eq.false&order=created_at.asc&limit=3', true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        JSON.parse(xhr.responseText).forEach(m => {
          window.petEngine.onAICommand(m);
          const p = new XMLHttpRequest();
          p.open('PATCH', SUPABASE_URL + '/rest/v1/ai_messages?id=eq.' + m.id, true);
          p.setRequestHeader('Content-Type', 'application/json');
          p.setRequestHeader('apikey', SUPABASE_KEY);
          p.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
          p.setRequestHeader('Prefer', 'return=minimal');
          p.send(JSON.stringify({ delivered: true }));
        });
      } catch(e) {}
    }
  };
  xhr.send();
}

function pollPetState() {
  if (!SUPABASE_URL || SUPABASE_URL.indexOf('%%') === 0) return;
  const xhr = new XMLHttpRequest();
  xhr.open('GET', SUPABASE_URL + '/rest/v1/pet_state?order=updated_at.desc&limit=5', true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        JSON.parse(xhr.responseText).forEach(s => {
          if (s.state_key === 'mood') showReaction(s.state_value);
          if (s.state_key === 'speech_bubble') say(s.state_value, 'normal', 6000);
          if (s.state_key === 'heat') {
            window.petEngine.heat = parseInt(s.state_value) || 0;
            document.getElementById('heat').style.opacity = window.petEngine.heat / 100;
          }
        });
      } catch(e) {}
    }
  };
  xhr.send();
}

// ===== 初始化 =====
renderPet('idle');
setInterval(pollAICommands, 5000);
setInterval(pollPetState, 30000);
setTimeout(() => say('嗯？', 'shy', 2000), 1500);
</script>
</body>
</html>]]>
