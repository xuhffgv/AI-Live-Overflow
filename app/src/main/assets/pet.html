<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #pet {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

  #bubble {
    position: absolute;
    top: -36px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.92);
    color: #333;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 10px;
    white-space: nowrap;
    max-width: 140px;
    text-overflow: ellipsis;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    font-family: sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  #bubble.show { opacity: 1; }
  #bubble.angry { background: #ff5252; color: #fff; }
  #bubble.shy { background: #e0e0e0; color: #666; }
  #bubble.love { background: #ff80ab; color: #fff; }

  #heat {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, rgba(255,0,0,0.2) 0%, transparent 70%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s;
  }
</style>
</head>
<body>
<div id="heat"></div>
<div id="bubble"></div>
<div id="pet"></div>

<script>
// ===== SUPABASE CONFIG =====
const SUPABASE_URL = 'https://gvzhoxepylrhseuumgls.supabase.co';
const SUPABASE_KEY = 'sb_publishable_shYLYrERVyrXtjiDbG62Ng_9TUH3pg8';

// ===== PIXEL ENGINE — nuko 8×10 full body =====
const PX = 8; // pixel unit size
const COLS = 8;
const ROWS = 10;
const VW = COLS * PX; // 64
const VH = ROWS * PX; // 80

// nuko palette: just white body + black eyes (+ pink for love)
const C = {
  X: null,      // transparent
  B: '#FFF8F0', // body white
  E: '#1a1a1a', // eye black
  P: '#FFB3B3', // pink (love eyes)
};

// base body matrix (8×10), shared across all expressions
// 0=transparent, 1=body, 2=eye placeholder
const bodyMap = [
  [0,0,0,1,1,0,0,0], // 0  ears
  [0,0,1,1,1,1,0,0], // 1  ears
  [0,1,1,1,1,1,1,0], // 2  head top
  [0,1,1,1,1,1,1,0], // 3  head
  [0,1,0,0,0,0,1,0], // 4  eye row (0=eye placeholder)
  [0,1,0,0,0,0,1,0], // 5  eye row
  [0,0,1,1,1,1,0,0], // 6  body
  [0,0,1,1,1,1,0,0], // 7  body
  [0,0,1,0,0,1,0,0], // 8  feet
  [0,0,0,1,1,0,0,0], // 9  tail
];

// color resolver — body=1→B, eye=2→E, pink=3→P
function resolveColor(val) {
  if (val === 0 || val === null || val === undefined) return null;
  const map = { 1: C.B, 2: C.E, 3: C.P };
  return map[val] || C.B;
}

// eye definitions: left eye at cols 2-3, right eye at cols 4-5, rows 4-5
// each eye is 2×2 = [topLeft,topRight,bottomLeft,bottomRight]
// 1=body(white), 2=black, 3=pink
const EYE_DEFS = {
  idle:    { L: [2,2,2,2], R: [2,2,2,2] },  // ●●  full black
  happy:   { L: [1,2,2,1], R: [1,2,2,1] },  // ^ ^  arched
  angry:   { L: [2,1,1,2], R: [2,1,1,2] },  // > <  angled
  love:    { L: [3,3,3,3], R: [3,3,3,3] },  // ♡♡  pink heart
  shy:     { L: [2,1,2,1], R: [2,1,2,1] },  // ··  half
  sleepy:  { L: [1,1,2,2], R: [1,1,2,2] },  // ‿‿  droopy
  surprise: { L: [1,2,2,1], R: [1,2,2,1] },  // ○○  wide ring
};

function buildPixelSVG(exp) {
  const ed = EYE_DEFS[exp] || EYE_DEFS.idle;

  let rects = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let color = null;
      // eye regions: rows 4-5, left eye cols 2-3, right eye cols 4-5
      if ((r === 4 || r === 5) && (c === 2 || c === 3)) {
        const idx = (r - 4) * 2 + (c - 2);
        color = resolveColor(ed.L[idx]);
      } else if ((r === 4 || r === 5) && (c === 4 || c === 5)) {
        const idx = (r - 4) * 2 + (c - 4);
        color = resolveColor(ed.R[idx]);
      } else {
        const v = bodyMap[r] ? bodyMap[r][c] : 0;
        color = resolveColor(v);
      }
      if (color) {
        rects += `<rect x="${c * PX}" y="${r * PX}" width="${PX}" height="${PX}" fill="${color}" shape-rendering="crispEdges"/>`;
      }
    }
  }
  return `<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

// ===== GLOBAL ENGINE =====
window.petEngine = {
  mood: 'idle',
  heat: 0,
  lastGestureTime: Date.now(),
  gestureCount: 0,

  onTap() {
    this.gestureCount++;
    this.lastGestureTime = Date.now();
    this.heat = Math.min(100, this.heat + 5);
    this.logGesture('tap');
    showRandomReaction('tap');
  },

  onDoubleTap() {
    this.gestureCount += 2;
    this.lastGestureTime = Date.now();
    this.heat = Math.min(100, this.heat + 12);
    this.logGesture('double_tap');
    showReaction('love');
    say('呀！别戳了', 'love');
  },

  onLongPress() {
    this.gestureCount += 3;
    this.lastGestureTime = Date.now();
    this.heat = Math.min(100, this.heat + 20);
    this.logGesture('long_press');
    showReaction('angry');
    say('……干嘛', 'shy');
  },

  onAICommand(cmd) {
    if (!cmd) return;
    switch (cmd.message_type) {
      case 'bubble':
        say(cmd.content, cmd.style || 'normal', (cmd.duration_seconds || 5) * 1000);
        break;
      case 'expression':
        showReaction(cmd.content);
        break;
      case 'action':
        playAnimation(cmd.content);
        break;
      case 'notification':
        say(cmd.content, 'angry', 8000);
        break;
    }
  },

  logGesture(type) {
    if (!SUPABASE_URL || SUPABASE_URL.indexOf('%%') === 0) return;
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/rest/v1/gesture_log', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
    xhr.setRequestHeader('Prefer', 'return=minimal');
    xhr.send(JSON.stringify({ gesture_type: type }));
  }
};

let currentExp = 'idle';
let animTimer = null;

function renderPet(exp) {
  currentExp = exp || currentExp;
  document.getElementById('pet').innerHTML = buildPixelSVG(currentExp);
}

function showReaction(exp) {
  renderPet(exp);
  clearTimeout(animTimer);
  animTimer = setTimeout(() => renderPet('idle'), 2500);
}

function showRandomReaction(gesture) {
  const pool = gesture === 'tap' ? ['happy', 'surprise'] : ['angry', 'shy'];
  const r = pool[Math.floor(Math.random() * pool.length)];
  showReaction(r);
}

function playAnimation(name) {
  const el = document.getElementById('pet');
  switch (name) {
    case 'bounce':
      el.style.transition = 'transform 0.1s';
      el.style.transform = 'translateY(-6px)';
      setTimeout(() => { el.style.transform = 'translateY(0)'; }, 120);
      setTimeout(() => { el.style.transition = ''; }, 250);
      break;
    case 'shake':
      el.style.transition = 'transform 0.08s';
      el.style.transform = 'rotate(-4deg)';
      setTimeout(() => { el.style.transform = 'rotate(4deg)'; }, 80);
      setTimeout(() => { el.style.transform = 'rotate(0)'; el.style.transition = ''; }, 160);
      break;
    case 'nod':
      el.style.transition = 'transform 0.12s';
      el.style.transform = 'translateY(3px)';
      setTimeout(() => { el.style.transform = 'translateY(0)'; el.style.transition = ''; }, 130);
      break;
  }
}

// ===== 气泡 =====
let bubbleTimer = null;
function say(text, style, duration) {
  const b = document.getElementById('bubble');
  b.textContent = text;
  b.className = style || '';
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove('show'), duration || 4000);
}

// ===== Heat 衰减 =====
setInterval(() => {
  window.petEngine.heat = Math.max(0, window.petEngine.heat - 1);
  document.getElementById('heat').style.opacity = window.petEngine.heat / 100;
}, 30000);

// ===== Supabase 轮询 =====
function pollAICommands() {
  if (!SUPABASE_URL || SUPABASE_URL.indexOf('%%') === 0) return;
  const xhr = new XMLHttpRequest();
  xhr.open('GET', SUPABASE_URL + '/rest/v1/ai_messages?delivered=eq.false&order=created_at.asc&limit=3', true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        JSON.parse(xhr.responseText).forEach(m => {
          window.petEngine.onAICommand(m);
          const p = new XMLHttpRequest();
          p.open('PATCH', SUPABASE_URL + '/rest/v1/ai_messages?id=eq.' + m.id, true);
          p.setRequestHeader('Content-Type', 'application/json');
          p.setRequestHeader('apikey', SUPABASE_KEY);
          p.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
          p.setRequestHeader('Prefer', 'return=minimal');
          p.send(JSON.stringify({ delivered: true }));
        });
      } catch(e) {}
    }
  };
  xhr.send();
}

function pollPetState() {
  if (!SUPABASE_URL || SUPABASE_URL.indexOf('%%') === 0) return;
  const xhr = new XMLHttpRequest();
  xhr.open('GET', SUPABASE_URL + '/rest/v1/pet_state?order=updated_at.desc&limit=5', true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        JSON.parse(xhr.responseText).forEach(s => {
          if (s.state_key === 'mood') showReaction(s.state_value);
          if (s.state_key === 'speech_bubble') say(s.state_value, 'normal', 6000);
          if (s.state_key === 'heat') {
            window.petEngine.heat = parseInt(s.state_value) || 0;
            document.getElementById('heat').style.opacity = window.petEngine.heat / 100;
          }
        });
      } catch(e) {}
    }
  };
  xhr.send();
}

// ===== 初始化 =====
renderPet('idle');
setInterval(pollAICommands, 5000);
setInterval(pollPetState, 30000);
setTimeout(() => say('嗯？', 'shy', 2000), 1500);
</script>
</body>
</html>
